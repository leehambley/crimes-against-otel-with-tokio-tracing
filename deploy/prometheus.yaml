global:
  scrape_interval: 5s
scrape_configs:
  - job_name: otel-collector
    # Keep the per-service `job` label the collector derives from service.name.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
