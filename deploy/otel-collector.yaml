# Every service exports 100% of the spans that pass its TRACE_FILTER to this
# collector. Sampling happens here, *after* a trace is complete, which is the
# only place "keep every trace that contains an error" can be decided: the
# error may occur in a different service, long after the root span was
# created.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # Policies are OR'd: a trace is kept if any policy says so.
  tail_sampling:
    decision_wait: ${env:SAMPLING_DECISION_WAIT:-5s}
    num_traces: 50000
    expected_new_traces_per_sec: 200
    policies:
      # Any span with status ERROR, except HTTP *client* spans that only got
      # a 4xx: semconv marks those as errors, but a 404 from a lookup
      # shouldn't force-keep the trace. Server 5xx, transport failures and
      # failed DB calls all still match.
      - name: keep-all-errors
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          span:
            - >-
              span.status.code == STATUS_CODE_ERROR and
              not (span.kind == SPAN_KIND_CLIENT and
                   span.attributes["http.response.status_code"] != nil and
                   span.attributes["http.response.status_code"] < 500)
      - name: keep-slow
        type: latency
        latency:
          threshold_ms: ${env:SAMPLING_SLOW_MS:-1000}
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:SAMPLING_PERCENT:-10}

  batch: {}

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  telemetry:
    logs:
      level: info
    # The collector's own metrics, incl. per-policy tail-sampling decisions
    # (otelcol_processor_tail_sampling_count_traces_sampled).
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp_grpc/jaeger]
    # Logs are not sampled either: every record that passes LOG_FILTER.
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
    # Metrics are never sampled: they come from every span, before sampling.
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
