# Metrics and logs in Grafana; traces stay in the Jaeger UI.
#
# Jaeger 2.21 serves only its v3 query API, which Grafana's Jaeger datasource
# doesn't speak, so there is no Jaeger datasource here. Instead every log line
# with a trace_id gets a "View trace" link that opens the Jaeger UI.
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: "http://localhost:16686/trace/$${__value.raw}"
          urlDisplayLabel: View trace in Jaeger
